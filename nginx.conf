# For more information on configuration, see:
#   * Official English Documentation: http://nginx.org/en/docs/
#   * Official Russian Documentation: http://nginx.org/ru/docs/

user nginx;
worker_processes 2;
error_log /var/log/nginx/error.log;
pid /run/nginx.pid;

# Load dynamic modules. See /usr/share/doc/nginx/README.dynamic.
include /usr/share/nginx/modules/*.conf;

events {
    worker_connections 1024;
}

http {
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    types_hash_max_size 4096;
    
    include             /etc/nginx/mime.types;
    default_type        application/octet-stream;

    # Load modular configuration files from the /etc/nginx/conf.d directory.
    # See http://nginx.org/en/docs/ngx_core_module.html#include
    # for more information.
    include /etc/nginx/conf.d/php-fpm.conf;



# Settings for a TLS enabled server.
    server {
        listen 80;
        server_name _;
        return 301 https://www.domenowo.org$request_uri;
    }

#
    server {
        listen       443 ssl http2 default_server;
        listen       [::]:443 ssl http2;
        server_name  _;
        root         /usr/share/nginx/domenowo2/public;

    
        gzip on;
        gzip_vary on;
        gzip_types
            application/atom+xml
            application/geo+json
            application/javascript
            application/x-javascript
            application/json
            application/ld+json
            application/manifest+json
            application/rdf+xml
            application/rss+xml
            application/xhtml+xml
            application/xml
            font/eot
            font/otf
            font/ttf
           # image/svg+xml
            text/css
            text/javascript
            text/plain
            text/xml; 
        gzip_min_length 256;
        gzip_comp_level 6;
        gzip_buffers 16 8k;
        gzip_proxied no-cache no-store private expired auth; 
    
        ssl_certificate "/etc/nginx/ssl/ssl-bundle.crt";
        ssl_certificate_key "/etc/nginx/ssl/domenowo.key";
        ssl_session_cache shared:SSL:1m;
        ssl_session_timeout  10m;
        ssl_ciphers PROFILE=SYSTEM;
        ssl_prefer_server_ciphers on;
        ssl_stapling on;
        ssl_stapling_verify on;
        ssl_trusted_certificate "/etc/nginx/ssl/fullchain.pem";
#        # Load configuration files for the default server block.
        include /etc/nginx/default.d/*.conf;
        error_page 404 /404.html;
    
        location ~* ^.+\.(js|css)$ {
            expires -1;
        }
        
        location / {
            autoindex on;
            index index.html;
        }    
    
        location /static {
            alias /usr/share/nginx/domenowo2/public/static;
        }
	location ~\.php$ {
	    #include /etc/nginx/mime.types;
	    fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;	    
        include fastcgi_params;
            	
    }	
}    
    server {
        listen       8080 ssl;
        server_name  _;
        root         /usr/share/nginx/domenowo_api;

        include /etc/nginx/default.d/*.conf;
        
        ssl_certificate "/etc/nginx/ssl/ssl-bundle.crt";
        ssl_certificate_key "/etc/nginx/ssl/domenowo.key";
        ssl_session_cache shared:SSL:1m;
        ssl_session_timeout  10m;
        ssl_ciphers PROFILE=SYSTEM;
        ssl_prefer_server_ciphers on;
        ssl_stapling on;
        ssl_stapling_verify on;
        ssl_trusted_certificate "/etc/nginx/ssl/fullchain.pem";

	location ~\.php$ {
	    include mime.types;
	    fastcgi_split_path_info ^(.+\.php)(/.+)$;
	    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
	    include fastcgi_params;
	}
    
    location ~/\.ht {
        deny all;
    }	
    }
}

